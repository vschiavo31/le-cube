<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Le Cube</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}#app{position:fixed;inset:0;touch-action:none;background:radial-gradient(circle at 50% 42%,#202631,#0b0e14 48%,#040506)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.title{font-weight:900;letter-spacing:.18em;font-size:14px}.stats{text-align:right;font-size:11px;color:#aeb7c6}.stats b{color:#fff}.hint{position:absolute;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 28px));transform:translateX(-50%);font-size:12px;color:#c3cad5;text-align:center;white-space:nowrap;pointer-events:none}</style></head><body><div id="app"><canvas id="c"></canvas><div class="top"><div class="title">LE CUBE</div><div class="stats">COUCHE <b>1</b><br>BLOCS <b id="total">—</b><br>DÉTRUITS <b id="broken">0</b><br>ZOOM <b id="zoom">100%</b></div></div><div class="hint" id="hint">1 doigt : tourner · 2 doigts : zoomer · tap : casser</div></div><script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d'),hint=document.querySelector('#hint'),brokenEl=document.querySelector('#broken'),zoomEl=document.querySelector('#zoom'),totalEl=document.querySelector('#total');
const N=42,TOTAL=N*N*6;totalEl.textContent=TOTAL.toLocaleString('fr-FR');let yaw=.68,pitch=.48,zoom=1,broken=0;const gone=new Set(),touches=new Map();let lastOne=null,pinchDist=0,pinchZoom=1,moved=0,twoFinger=false;
function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function rot(p){let[x,y,z]=p,cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);let x1=x*cy+z*sy,z1=-x*sy+z*cy;return[x1,y*cx-z1*sx,y*sx+z1*cx]}
/* Camera is in front of the screen, looking along +Z. Smaller rotated Z is closer. */
function project(p){let q=rot(p),cam=5.4,den=cam+q[2],s=Math.min(innerWidth,innerHeight)*1.18*zoom/den;return{x:innerWidth/2+q[0]*s,y:innerHeight/2-q[1]*s,z:q[2]}}
const faces=[{id:0,n:[0,0,1],p:(u,v,d)=>[-1+2*u,1-2*v,1-d]},{id:1,n:[1,0,0],p:(u,v,d)=>[1-d,1-2*v,1-2*u]},{id:2,n:[0,0,-1],p:(u,v,d)=>[1-2*u,1-2*v,-1+d]},{id:3,n:[-1,0,0],p:(u,v,d)=>[-1+d,1-2*v,-1+2*u]},{id:4,n:[0,1,0],p:(u,v,d)=>[-1+2*u,1-d,-1+2*v]},{id:5,n:[0,-1,0],p:(u,v,d)=>[-1+2*u,-1+d,1-2*v]}];
function poly(f,i,j,depth=0){let a=i/N,b=j/N,c=(i+1)/N,d=(j+1)/N,dep=depth*2/N;return[project(f.p(a,b,dep)),project(f.p(c,b,dep)),project(f.p(c,d,dep)),project(f.p(a,d,dep))]}
/* With this camera convention, exterior faces point toward -Z. */
function visible(f){return rot(f.n)[2]<-.015}
function shade(f,depth){let n=rot(f.n),front=Math.max(0,-n[2]),side=Math.max(0,n[0]*-.3+n[1]*-.35-n[2]*.7),v=Math.max(52,Math.round(105+front*105+side*35-depth*32));return `rgb(${v},${Math.min(255,v+5)},${Math.min(255,v+10)})`}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);let fs=faces.filter(visible).sort((a,b)=>rot(b.n)[2]-rot(a.n)[2]);for(const f of fs){for(let j=0;j<N;j++)for(let i=0;i<N;i++){let key=f.id+':'+i+':'+j,depth=gone.has(key)?1:0,p=poly(f,i,j,depth);ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let k=1;k<4;k++)ctx.lineTo(p[k].x,p[k].y);ctx.closePath();ctx.fillStyle=shade(f,depth);ctx.fill();let cell=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);if(cell>2.2){ctx.strokeStyle=depth?'rgba(0,0,0,.62)':'rgba(0,0,0,.30)';ctx.lineWidth=Math.min(1,cell*.09);ctx.stroke()}if(depth&&cell>3.5){let o=poly(f,i,j,0);for(const ids of [[0,1],[1,2],[2,3],[3,0]]){let[a,b]=ids;ctx.beginPath();ctx.moveTo(o[a].x,o[a].y);ctx.lineTo(o[b].x,o[b].y);ctx.lineTo(p[b].x,p[b].y);ctx.lineTo(p[a].x,p[a].y);ctx.closePath();ctx.fillStyle='rgb(35,37,42)';ctx.fill()}}}}}
function inside(p,x,y){let s=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if(((a.y>y)!=(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))s=!s}return s}
function hit(x,y){let fs=faces.filter(visible).sort((a,b)=>rot(a.n)[2]-rot(b.n)[2]);for(const f of fs)for(let j=0;j<N;j++)for(let i=0;i<N;i++){let k=f.id+':'+i+':'+j;if(!gone.has(k)&&inside(poly(f,i,j,0),x,y))return k}return null}
function crack(x,y){let k=hit(x,y);if(!k){hint.textContent='Touche une petite case';return}gone.add(k);broken++;brokenEl.textContent=broken.toLocaleString('fr-FR');hint.textContent='CRAC — '+broken.toLocaleString('fr-FR')+' blocs détruits';draw()}
function dist(){let a=[...touches.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}function showZoom(){zoomEl.textContent=Math.round(zoom*100)+'%'}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){lastOne={x:e.clientX,y:e.clientY};moved=0;twoFinger=false}else if(touches.size===2){pinchDist=dist();pinchZoom=zoom;twoFinger=true;lastOne=null}},{passive:false});
cv.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;e.preventDefault();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1&&lastOne){let dx=e.clientX-lastOne.x,dy=e.clientY-lastOne.y;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.008;pitch+=dy*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch));lastOne={x:e.clientX,y:e.clientY};draw()}else if(touches.size===2&&pinchDist){zoom=Math.max(.55,Math.min(8,pinchZoom*dist()/pinchDist));showZoom();draw()}},{passive:false});
function end(e){if(!touches.has(e.pointerId))return;let pt=touches.get(e.pointerId),wasOne=touches.size===1;touches.delete(e.pointerId);if(wasOne&&!twoFinger&&moved<9)crack(pt.x,pt.y);if(touches.size===1){let a=[...touches.values()][0];lastOne={x:a.x,y:a.y}}else{lastOne=null;if(!touches.size)twoFinger=false}if(!touches.size&&moved>=9)hint.textContent='1 doigt : tourner · 2 doigts : zoomer · tap : casser'}cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});resize();showZoom();
</script></body></html>
